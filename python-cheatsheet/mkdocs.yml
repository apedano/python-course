site_name: Python Cheatsheet
site_description: Personal Python notes & code snippets
site_author: Alessandro

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.tabbed
  - toc:
      permalink: true

plugins:
  - search
nav:
  - Home: index.md
  - Basics Concepts:
      - basics/index.md
  - Collections:
      - collections/index.md
  - Itertools:
      - itertools/index.md
  - Async:
      - async/index.md
  - Typing:
      - typing/index.md
  - Gotchas:
      - gotchas/index.md
