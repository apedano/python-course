<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% for post in posts %}
<div class="post" style="background-color: #11cdd4">
    <h1>{{post.title}}</h1>
    {% if post.subtitle %}
        <h2>{{post.subtitle}}</h2>
    {% endif %}
    <p>{{post.body}}</p>
</div>
{% endfor %}

</body>
</html>
